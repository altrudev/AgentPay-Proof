<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1474 610" role="img" aria-label="AgentPay evidence landscape">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06192b"/><stop offset=".52" stop-color="#03111f"/><stop offset="1" stop-color="#020914"/></linearGradient>
 <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#154d7a"/><stop offset=".72" stop-color="#071a2d"/><stop offset="1" stop-color="#03101d"/></linearGradient>
 <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0e3558"/><stop offset="1" stop-color="#06131f"/></linearGradient>
 <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#068cff"/><stop offset=".38" stop-color="#dff8ff"/><stop offset=".63" stop-color="#39c9ff"/><stop offset="1" stop-color="#0788ff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4ad4ff"/><stop offset=".52" stop-color="#ffe7a0"/><stop offset="1" stop-color="#38c6ff"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 14 14 0 28 14 14 28Z" fill="none" stroke="#63d5ff" stroke-opacity=".18"/><circle cx="14" cy="14" r="1.3" fill="#eefcff" fill-opacity=".55"/></pattern>
 <pattern id="vysh" width="34" height="34" patternUnits="userSpaceOnUse">
  <rect width="34" height="34" fill="#06172b"/>
  <path d="M17 1 33 17 17 33 1 17Z" fill="none" stroke="#eafaff" stroke-width="2.4"/>
  <path d="M17 6 28 17 17 28 6 17Z" fill="none" stroke="#159dff" stroke-width="3"/>
  <rect x="13" y="13" width="8" height="8" transform="rotate(45 17 17)" fill="#79deff"/>
 </pattern>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1474" height="610" fill="url(#bg)"/>
<ellipse cx="1040" cy="160" rx="520" ry="220" fill="#147fd0" opacity=".10" filter="url(#soft)"/>
